# Entorno de desarrollo completo: base de datos + backend + frontend con hot-reload.
# Uso: docker compose up --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sw2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sw2password}
      POSTGRES_DB: ${DB_NAME:-sw2}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-sw2} -d ${DB_NAME:-sw2}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: installer
    restart: unless-stopped
    # Genera el cliente de Prisma, aplica migraciones, carga la seed (idempotente) y arranca con watch
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sw2}:${DB_PASSWORD:-sw2password}@db:5432/${DB_NAME:-sw2}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 4000
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: installer
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
